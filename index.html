    <script>
        // Initialize markdown-it
        const md = window.markdownit({
            html: true,
            linkify: true,
            typographer: true,
            highlight: () => ''
        });

        // Page loading notes:
        // 1. Default entry: index.html -> 01_home.md
        // 2. Local markdown:  index.html?page=03_misc.md
        // 3. Remote markdown: index.html?page=https://.../README.md
        // 4. GitHub blob URLs are normalized to raw.githubusercontent.com automatically.
        const DEFAULT_PAGE = '01_home.md';
        let currentMarkdownFile = DEFAULT_PAGE;
        const markdownCache = new Map();
        let syntaxAssetsPromise = null;
        let visitorMapScriptPromise = null;

        function isRemotePage(page) {
            return /^https?:\/\//i.test(page);
        }

        function normalizeRemoteMarkdownUrl(url) {
            try {
                const parsed = new URL(url);
                if (parsed.hostname === 'github.com') {
                    const parts = parsed.pathname.split('/').filter(Boolean);
                    if (parts.length >= 5 && parts[2] === 'blob' && /\.md$/i.test(parts[parts.length - 1])) {
                        const [, owner, repo, , branch, ...rest] = parts;
                        return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${rest.join('/')}`;
                    }
                }
                return url;
            } catch (_) {
                return url;
            }
        }

        function isAllowedRemoteMarkdownUrl(page) {
            try {
                const normalized = normalizeRemoteMarkdownUrl(page);
                const parsed = new URL(normalized);
                return /^https?:$/i.test(parsed.protocol) && /\.md$/i.test(parsed.pathname);
            } catch (_) {
                return false;
            }
        }

        // Read ?page=... from the URL.
        // Supported values:
        // - relative local markdown paths inside this site
        // - remote http(s) markdown URLs ending in .md
        function getRequestedPage() {
            const params = new URLSearchParams(window.location.search);
            const page = params.get('page');
            if (!page) return DEFAULT_PAGE;
            if (isRemotePage(page)) {
                return isAllowedRemoteMarkdownUrl(page) ? normalizeRemoteMarkdownUrl(page) : DEFAULT_PAGE;
            }
            if (page.startsWith('/') || page.startsWith('//')) {
                return DEFAULT_PAGE;
            }
            if (!/\.md$/i.test(page)) {
                return DEFAULT_PAGE;
            }
            return page;
        }

        function updateActiveNav(pageFile) {
            const navLinks = document.querySelectorAll('.nav-page');
            navLinks.forEach(link => {
                link.classList.toggle('active', link.getAttribute('data-page') === pageFile);
            });
        }

        function updatePageUrl(pageFile) {
            const url = new URL(window.location.href);
            if (pageFile === DEFAULT_PAGE) {
                url.searchParams.delete('page');
            } else {
                url.searchParams.set('page', pageFile);
            }
            history.replaceState(null, null, `${url.pathname}${url.search}${url.hash}`);
        }

        async function navigateToPageSection(pageFile, sectionId) {
            updateActiveNav(pageFile);
            if (currentMarkdownFile !== pageFile) {
                await loadMarkdownFile(pageFile);
            }

            const url = new URL(window.location.href);
            if (pageFile === DEFAULT_PAGE) {
                url.searchParams.delete('page');
            } else {
                url.searchParams.set('page', pageFile);
            }
            url.hash = sectionId;
            history.replaceState(null, null, `${url.pathname}${url.search}${url.hash}`);

            const target = document.getElementById(sectionId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // After rendering markdown, convert site-relative .md links into ?page=... links
        // so they continue to open inside this single-page shell instead of leaving it.
        // Examples:
        // - [Note](07_notes.md) -> ?page=07_notes.md
        // - [Remote](https://.../README.md) -> ?page=https%3A%2F%2F...%2FREADME.md
        // - [Part](07_notes.md#part-2) keeps the hash fragment.
        function skipsMarkdownRendering(link) {
            return link?.getAttribute('data-render-markdown') === 'false';
        }

        function rewriteMarkdownLinks(container, currentFile) {
            const currentDir = isRemotePage(currentFile)
                ? currentFile
                : (currentFile.includes('/') ? currentFile.slice(0, currentFile.lastIndexOf('/') + 1) : '');
            container.querySelectorAll('a[href]').forEach(link => {
                const href = link.getAttribute('href');
                // Explicit opt-out for links that must follow normal browser navigation.
                if (skipsMarkdownRendering(link)) {
                    return;
                }
                if (!href || href.startsWith('#') || href.startsWith('?page=') || href.startsWith('mailto:') || href.startsWith('javascript:')) {
                    return;
                }
                if (/^(https?:)?\/\//i.test(href) && !/\.md($|#|\?)/i.test(href)) {
                    return;
                }

                const [pathPart, hashPart] = href.split('#', 2);
                if (!/\.md($|\?)/i.test(pathPart)) {
                    return;
                }

                let resolvedPath;
                if (isRemotePage(currentFile)) {
                    resolvedPath = normalizeRemoteMarkdownUrl(new URL(pathPart, currentDir).href);
                } else if (isRemotePage(pathPart)) {
                    resolvedPath = normalizeRemoteMarkdownUrl(pathPart);
                } else {
                    resolvedPath = new URL(pathPart, `https://local/${currentDir}`).pathname.replace(/^\/+/, '');
                }

                link.setAttribute('href', `?page=${encodeURIComponent(resolvedPath)}${hashPart ? `#${hashPart}` : ''}`);
            });
        }

        function preparePublicationTranslationLines(root) {
            root.querySelectorAll('.pub-container p').forEach(paragraph => {
                if (paragraph.querySelector(':scope > .translation-line')) return;

                const lines = [];
                let line = document.createElement('span');
                line.className = 'translation-line';

                Array.from(paragraph.childNodes).forEach(node => {
                    if (node.nodeName === 'BR') {
                        lines.push(line);
                        line = document.createElement('span');
                        line.className = 'translation-line';
                    } else {
                        line.appendChild(node);
                    }
                });

                if (line.hasChildNodes() || lines.length === 0) {
                    lines.push(line);
                }
                paragraph.replaceChildren(...lines);
            });
        }

        function prepareRenderedContent(fragment) {
            preparePublicationTranslationLines(fragment);
            fragment.querySelectorAll('img').forEach(img => {
                img.loading = 'lazy';
                img.decoding = 'async';
                if (img.closest('.tab-content:not(.active)') && img.hasAttribute('src')) {
                    img.dataset.src = img.getAttribute('src');
                    img.dataset.loadWhen = 'tab';
                    img.removeAttribute('src');
                } else if (img.closest('.pub-container, .exp-tab-content') && img.hasAttribute('src')) {
                    img.dataset.src = img.getAttribute('src');
                    img.dataset.loadWhen = 'viewport';
                    img.removeAttribute('src');
                }
            });
        }

        function activateDeferredImages(root = document) {
            root.querySelectorAll('.tab-content.active img[data-load-when="tab"]').forEach(img => {
                img.src = img.dataset.src;
                delete img.dataset.src;
                delete img.dataset.loadWhen;
            });
        }

        function initializeViewportImages(root) {
            const images = root.querySelectorAll('img[data-load-when="viewport"]');
            if (!images.length) return;
            const load = img => {
                img.src = img.dataset.src;
                delete img.dataset.src;
                delete img.dataset.loadWhen;
            };
            if (!('IntersectionObserver' in window)) {
                images.forEach(load);
                return;
            }
            const observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    observer.unobserve(entry.target);
                    load(entry.target);
                });
            }, { rootMargin: '300px 0px' });
            images.forEach(img => observer.observe(img));
        }

        function loadStylesheet(href) {
            if (document.querySelector(`link[href="${href}"]`)) return Promise.resolve();
            return new Promise((resolve, reject) => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = href;
                link.onload = resolve;
                link.onerror = reject;
                document.head.appendChild(link);
            });
        }

        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }

        async function initializeCodeHighlighting(root) {
            const blocks = root.querySelectorAll('pre code');
            if (!blocks.length) return;
            syntaxAssetsPromise ||= Promise.all([
                loadStylesheet('./static/vendor/github.min.css'),
                loadScript('./static/vendor/highlight.min.js')
            ]);
            try {
                await syntaxAssetsPromise;
                blocks.forEach(block => window.hljs?.highlightElement(block));
            } catch (error) {
                console.warn('Syntax highlighting unavailable:', error);
            }
        }

        function ensureVisitorMapScript(src) {
            if (window.initializeVisitorMaps) return Promise.resolve();
            visitorMapScriptPromise ||= loadScript(src);
            return visitorMapScriptPromise;
        }

        function initializeLazyComponents(root) {
            const widget = root.querySelector('[data-visitor-map]');
            const script = root.querySelector('script[data-lazy-src]');
            if (!widget || !script) return;
            const activate = async () => {
                widget.classList.add('is-ready');
                try {
                    await ensureVisitorMapScript(script.dataset.lazySrc);
                    window.initializeVisitorMaps?.(root);
                } catch (error) {
                    console.warn('Visitor map unavailable:', error);
                }
            };
            if (!('IntersectionObserver' in window)) {
                activate();
                return;
            }
            const observer = new IntersectionObserver(entries => {
                if (!entries.some(entry => entry.isIntersecting)) return;
                observer.disconnect();
                activate();
            }, { rootMargin: '300px 0px' });
            observer.observe(widget);
        }

        // Load markdown text from either:
        // - a local file in this repo, or
        // - a remote markdown URL
        // Remote fetch first tries direct access, then several public proxies as fallback.
        async function fetchMarkdownContent(filename) {
            if (markdownCache.has(filename)) return markdownCache.get(filename);
            const request = (async () => {
                if (!isRemotePage(filename)) {
                    const response = await fetch(filename);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                }

                const proxies = [
                    (url) => url,
                    (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                    (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                    (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
                ];

                let lastError = null;
                for (const getUrl of proxies) {
                    try {
                        const response = await fetch(getUrl(filename));
                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }
                        return response.text();
                    } catch (error) {
                        lastError = error;
                    }
                }
                throw lastError || new Error('Failed to load remote markdown');
            })();
            markdownCache.set(filename, request);
            try {
                return await request;
            } catch (error) {
                markdownCache.delete(filename);
                throw error;
            }
        }

        // Main render entry for the center content area.
        // This function also rewrites markdown links so follow-up navigation stays in-template.
        async function loadMarkdownFile(filename) {
            try {
                const markdown = await fetchMarkdownContent(filename);
                const element = document.getElementById('abstract');
                currentMarkdownFile = filename;
                if (element) {
                    const template = document.createElement('template');
                    template.innerHTML = md.render(markdown);
                    prepareRenderedContent(template.content);
                    element.replaceChildren(template.content);
                    if (typeof window.initializeTextWalls === 'function') {
                        await window.initializeTextWalls(element);
                    }
                    if (typeof window.initializePublications === 'function') {
                        await window.initializePublications(element, md);
                        element.querySelectorAll('[data-publications]').forEach(prepareRenderedContent);
                    }
                    rewriteMarkdownLinks(element, filename);
                    activateDeferredImages(element);
                    initializeViewportImages(element);
                }
                // Re-add header links after rendering
                addHeaderLinks();

                // Fetch citation counts for any author elements
                fetchCitationCounts();

                // Initialize <fn> footnote elements
                initFootnotes();

                // Fetch GitHub repo descriptions for repo cards
                fetchRepoDescriptions();

                // Load optional code and visitor-map assets only when needed
                initializeCodeHighlighting(element);
                initializeLazyComponents(element);

                // Execute any scripts that were rendered in the markdown
                const scripts = element.querySelectorAll('script:not([data-lazy-src])');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    // Copy all attributes
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });
                    // Copy the script content
                    newScript.textContent = oldScript.textContent;
                    // Replace old script with new one to trigger execution
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {
                console.error(`Error loading ${filename}:`, error);
                const element = document.getElementById('abstract');
                if (element) {
                    element.innerHTML = `<p>Error loading content from ${filename}</p>`;
                }
            }
        }

        // Handle navigation clicks
        function setupNavigation() {
            const navLinks = document.querySelectorAll('.nav-page');
            navLinks.forEach(link => {
                link.addEventListener('click', async (e) => {
                    e.preventDefault();

                    const pageFile = link.getAttribute('data-page');
                    updateActiveNav(pageFile);
                    updatePageUrl(pageFile);
                    await loadMarkdownFile(pageFile);
                });
                link.addEventListener('mouseenter', () => {
                    fetchMarkdownContent(link.getAttribute('data-page')).catch(() => {});
                }, { once: true });
            });

            document.addEventListener('click', (e) => {
                if (e.target.closest('.tab')) {
                    requestAnimationFrame(() => activateDeferredImages(document));
                }
                const link = e.target.closest('.nav-section-link');
                if (!link) return;

                e.preventDefault();
                navigateToPageSection(
                    link.getAttribute('data-page'),
                    link.getAttribute('data-section')
                );
            });
        }

        // Initial content loading
        async function loadAndRenderContent() {
            const initialPage = getRequestedPage();
            updateActiveNav(initialPage);
            await loadMarkdownFile(initialPage);

            // Smooth scrolling for sidebar navigation
            document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                anchor.addEventListener('click', function (e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('href').substring(1);
                    const targetElement = document.getElementById(targetId);
                    
                    if (targetElement) {
                        // 临时更新URL但不触发跳转
                        history.replaceState(null, null, `${window.location.pathname}${window.location.search}#${targetId}`);
                        targetElement.scrollIntoView({ behavior: 'smooth' });
                        
                        // 延迟移除锚点，让跳转完成
                        setTimeout(() => {
                            history.replaceState(null, null, `${window.location.pathname}${window.location.search}`);
                        }, 200);

                        // If sidebar is not locked, hide it after navigation
                        if (CONFIG.autoHideSidebar && !sidebar.classList.contains('locked')) {
                            sidebar.classList.remove('active');
                        }
                    }
                });
            });

            // 检查URL中的锚点并跳转
            setTimeout(() => {
                if (window.location.hash) {
                    const element = document.getElementById(window.location.hash.substring(1));
                    if (element) {
                        element.scrollIntoView({ behavior: 'smooth' });
                    }
                }
            }, 100);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            // 强制跳转到title位置
            setTimeout(() => {
                window.scrollTo({ top: 0, behavior: 'auto' });
            }, 100);

            // Setup navigation
            setupNavigation();

            // Load and render default markdown content
            loadAndRenderContent();
            
            // Sidebar animation
            setTimeout(() => {
                const sidebar = document.querySelector('.sidebar');
                if (sidebar) {
                    sidebar.classList.add('active');
                    if (CONFIG.autoHideSidebar) {
                        setTimeout(() => {
                            if (!sidebar.classList.contains('locked')) {
                                sidebar.classList.remove('active');
                            }
                        }, 1000);
                    }
                }
            }, 100);
        });

        // Lock button functionality
        const lockButton = document.querySelector('.lock-button');
        const sidebar = document.querySelector('.sidebar');

        if (lockButton && sidebar) {
            lockButton.addEventListener('click', function() {
                const icon = this.querySelector('i');
                if (icon.classList.contains('fa-lock-open')) {
                    icon.classList.remove('fa-lock-open');
                    icon.classList.add('fa-lock');
                    sidebar.classList.add('locked');
                } else {
                    icon.classList.remove('fa-lock');
                    icon.classList.add('fa-lock-open');
                    sidebar.classList.remove('locked');
                    sidebar.classList.remove('active');
                }
            });
        }

        // Configuration for auto-collapse feature
        const CONFIG = {
            autoCollapse: false,  // Set to true to enable auto-collapse, false to disable
            autoHideSidebar: false  // Set to true to auto-hide sidebar, false to keep it visible
        };

        // Sidebar section toggle
        document.querySelectorAll('.nav-section-title').forEach(title => {
            title.addEventListener('click', (e) => {
                if (CONFIG.autoCollapse) {
                    const section = title.closest('.nav-section');
                    section.classList.toggle('collapsed');
                }
            });
        });


        // 格式化数字为简略形式 (31422 -> 31k)
        function formatNumber(num, short = false) {
            if (!short) return num;
            const n = parseInt(num.replace(/,/g, ''), 10);
            if (isNaN(n)) return num;
            if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
            return num;
        }

        // 获取 Google Scholar 引用数的函数
        // 用法: <span data-gscholar="https://scholar.google.com/citations?user=XXXXX">Loading...</span>
        // 简略模式: <span data-gscholar="..." data-gscholar-short="true">Loading...</span>
        async function fetchCitationCounts() {
            const elements = document.querySelectorAll('[data-gscholar]');

            // 多个代理服务备选
            const proxies = [
                (url) => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
                (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (const el of elements) {
                const scholarUrl = el.dataset.gscholar;
                const useShort = el.dataset.gscholarShort === 'true';
                let success = false;

                for (const getProxyUrl of proxies) {
                    if (success) break;

                    try {
                        const proxyUrl = getProxyUrl(scholarUrl);
                        const response = await fetch(proxyUrl);
                        const html = await response.text();

                        // 解析 HTML 获取引用数（在 gsc_rsb_std 类的元素中）
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const citationElements = doc.querySelectorAll('.gsc_rsb_std');

                        if (citationElements.length >= 1) {
                            const totalCitations = citationElements[0].textContent;
                            const hIndex = citationElements.length >= 3 ? citationElements[2].textContent : 'N/A';
                            const i10Index = citationElements.length >= 5 ? citationElements[4].textContent : 'N/A';

                            el.textContent = formatNumber(totalCitations, useShort);
                            el.title = `Total Citations: ${totalCitations}, h-index: ${hIndex}, i10-index: ${i10Index}`;

                            // 添加点击跳转
                            if (!el.closest('a')) {
                                el.style.cursor = 'pointer';
                                el.onclick = () => window.open(scholarUrl, '_blank');
                            }
                            success = true;
                        }
                    } catch (error) {
                        console.warn('Proxy failed, trying next...', error);
                    }
                }

                if (!success) {
                    el.textContent = 'N/A';
                    console.error('All proxies failed for:', scholarUrl);
                }
            }
        }

        function initFootnotes() {
            document.querySelectorAll('fn:not([data-init])').forEach(el => {
                const text = el.textContent.trim();
                el.setAttribute('data-init', '');
                el.innerHTML = `<span class="fn-text">${text}</span>`;
            });
        }

        const PROJECT_CACHE_KEY = 'project-metadata-cache-v1';
        const PROJECT_CACHE_TTL = 6 * 60 * 60 * 1000;

        function readProjectCache() {
            try {
                return JSON.parse(localStorage.getItem(PROJECT_CACHE_KEY)) || {};
            } catch (error) {
                return {};
            }
        }

        function writeProjectCache(cache) {
            try {
                localStorage.setItem(PROJECT_CACHE_KEY, JSON.stringify(cache));
            } catch (error) {
                // The page still works when storage is disabled or full.
            }
        }

        async function fetchProjectMetadata(cache, cacheId, url, normalize) {
            const cached = cache[cacheId];
            if (cached && Date.now() - cached.updatedAt < PROJECT_CACHE_TTL) {
                return cached;
            }

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const metadata = {
                    ...normalize(await response.json()),
                    updatedAt: Date.now()
                };
                cache[cacheId] = metadata;
                writeProjectCache(cache);
                return metadata;
            } catch (error) {
                if (cached) return cached;
                console.warn(`Failed to fetch project metadata for ${cacheId}:`, error);
                return null;
            }
        }

        async function fetchRepoDescriptions() {
            const summary = document.querySelector('[data-projects-summary]');
            const cache = readProjectCache();
            const githubTasks = Array.from(document.querySelectorAll('.repo-card-desc[data-repo]')).map(async el => {
                const repo = el.dataset.repo;
                const metadata = await fetchProjectMetadata(
                    cache,
                    `github:${repo}`,
                    `https://api.github.com/repos/${repo}`,
                    data => ({
                        description: data.description || '',
                        stars: Number(data.stargazers_count) || 0,
                        forks: Number(data.forks_count) || 0
                    })
                );
                if (metadata?.description) el.textContent = metadata.description;
                return metadata ? { ...metadata, led: !el.hasAttribute('data-contributed-only') } : null;
            });

            const huggingFaceSources = [
                { selector: '.repo-card-desc[data-hf]', datasetKey: 'hf', apiType: 'datasets', cacheType: 'dataset' },
                { selector: '.repo-card-desc[data-hf-model]', datasetKey: 'hfModel', apiType: 'models', cacheType: 'model' },
                { selector: '.repo-card-desc[data-hf-space]', datasetKey: 'hfSpace', apiType: 'spaces', cacheType: 'space' }
            ];
            const huggingFaceTasks = huggingFaceSources.flatMap(source =>
                Array.from(document.querySelectorAll(source.selector)).map(async el => {
                    const repo = el.dataset[source.datasetKey];
                    const metadata = await fetchProjectMetadata(
                        cache,
                        `huggingface-${source.cacheType}:${repo}`,
                        `https://huggingface.co/api/${source.apiType}/${repo}`,
                        data => ({
                            description: data.cardData?.pretty_name || data.cardData?.short_description || data.description || '',
                            stars: Number(data.likes) || 0,
                            forks: 0
                        })
                    );
                    if (metadata?.description) el.textContent = metadata.description;
                    return metadata ? { ...metadata, led: !el.hasAttribute('data-contributed-only') } : null;
                })
            );
            const projectStats = (await Promise.all([...githubTasks, ...huggingFaceTasks])).filter(Boolean);

            if (summary && projectStats.length) {
                const totals = projectStats.reduce((sum, project) => ({
                    stars: sum.stars + project.stars,
                    forks: sum.forks + project.forks
                }), { stars: 0, forks: 0 });
                const ledTotals = projectStats.filter(project => project.led).reduce((sum, project) => ({
                    stars: sum.stars + project.stars,
                    forks: sum.forks + project.forks
                }), { stars: 0, forks: 0 });
                const formatThousands = value => `${(Math.ceil(value / 10) / 100).toFixed(2)}k`;
                summary.querySelector('[data-led-stars]').textContent = formatThousands(ledTotals.stars);
                summary.querySelector('[data-led-forks]').textContent = formatThousands(ledTotals.forks);
                summary.querySelector('[data-total-stars]').textContent = formatThousands(totals.stars);
                summary.querySelector('[data-total-forks]').textContent = formatThousands(totals.forks);
            }
        }

        // 为标题添加锚点链接的函数
        function addHeaderLinks() {
            // 生成slug的函数
            function generateSlug(text) {
                return text
                    .toLowerCase()
                    .replace(/[^\w\s-]/g, '') // 移除特殊字符
                    .replace(/\s+/g, '-')     // 空格替换为连字符
                    .replace(/-+/g, '-')      // 多个连字符合并为一个
                    .replace(/^-+|-+$/g, ''); // 移除首尾连字符
            }

            // 为所有标题添加ID和链接
            const headers = document.querySelectorAll('.markdown-section h1, .markdown-section h2, .markdown-section h3, .markdown-section h4, .markdown-section h5, .markdown-section h6, .html-section h1, .html-section h2, .html-section h3, .html-section h4, .html-section h5, .html-section h6');
            
            headers.forEach(header => {
                if (header.querySelector(':scope > a.header-link')) return;
                const text = header.textContent;
                const slug = generateSlug(text);
                
                // 设置ID
                header.id = slug;
                
                // 创建链接元素
                const link = document.createElement('a');
                link.href = `#${slug}`;
                link.className = 'header-link';
                link.innerHTML = '#';
                
                // 添加点击事件处理
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    history.pushState(null, null, `#${slug}`);
                    header.scrollIntoView({ behavior: 'smooth' });
                });
                
                // 将链接插入到标题中
                header.appendChild(link);
            });
        }

    </script>
